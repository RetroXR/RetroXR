name: SideQuest

# A reporter, not a notifier. SideQuest hears of a release from the repository
# itself: its release-webhook is a GitHub repository webhook on RetroXR/RetroXR
# ("Releases" events only, JSON), as sidequestvr.com/github-releases says.
# POSTing the payload to it from CI changed nothing (v0.3.0, v0.5.0-rc,
# v0.10.0), and its answer was never an oracle: 200 whatever happens, a
# malformed payload 200 "No! repo". The version-webhook it used to pair with
# answers 410 Gone to every request, a deliberately fake token included.
#
# What is true: the public listing says what SideQuest serves, and App Studio's
# GitHub releases settings read the repo's releases live. So this checks the
# release carries an APK, gives the webhook a few minutes, checks what the
# listing serves, and prints the manual steps when the two disagree.
#
# SideQuest only accepts a build whose Android versionCode is HIGHER than the
# one already listed. That lives in RetroXR/export_presets.cfg (`version/code`)
# and has to be bumped by hand alongside `version/name`.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to check (e.g. v0.2.0)
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      APP_ID: '61366'
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Check the release carries an APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
                  | jq -r '[.assets[] | select(.name | endswith(".apk"))] | first | .name // ""')
          if [ -z "$apk" ]; then
            echo "::error::release $TAG carries no .apk asset - nothing for SideQuest to pick up"
            exit 1
          fi
          echo "$TAG -> $apk"

      - name: Report what SideQuest is serving
        run: |
          set -uo pipefail

          # api.sidequestvr.com 403s a bare urllib-style client; curl is fine.
          serving() {
            curl -sS --max-time 30 "https://api.sidequestvr.com/v2/apps/$APP_ID" \
              | jq -r '[.urls[] | select(.provider == "Github Release") | .link_url] | join(" ")'
          }

          # The webhook updates the listing while Release is left on [ latest ],
          # but not at once, so give it a few minutes before assuming it needs a
          # hand.
          for _ in $(seq 1 18); do
            now=$(serving || true)
            case "$now" in
              *"/download/$TAG/"*)
                echo "SideQuest is serving $TAG:"
                echo "  $now"
                exit 0 ;;
            esac
            sleep 10
          done

          echo "listing serves: ${now:-<unreadable>}"
          {
            echo "### SideQuest still needs a hand"
            echo
            echo "The listing is not serving \`$TAG\` yet. Set it by hand:"
            echo
            echo "App Studio > RetroXR > Distribution > **GitHub releases**: check the"
            echo "owner and repository read \`RetroXR\` / \`RetroXR\` and Release reads"
            echo "\`[ latest ]\`, then *Save changes* (the button is in the bar at the"
            echo "bottom). Saving reads the repo's releases again and pulls every asset"
            echo "on the newest one (the Windows and macOS zips come along with the APK)."
            echo
            echo "Choosing \`$TAG\` itself instead of \`[ latest ]\` pins the listing to"
            echo "that tag, and the webhook stops moving it on."
            echo
            echo "Also check the repository's webhook deliveries (Settings > Webhooks)"
            echo "for this release's: SideQuest's answer is there."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::SideQuest is not serving $TAG - save the listing's GitHub releases in App Studio (steps in the job summary)"
